name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py --update-portal
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/build.py
      - run: tar -czf site.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: static-site
          path: site.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-static.yml
    with:
      origin: ${{ vars.STATIC_ORIGIN }}
      user: ${{ vars.STATIC_DEPLOY_USER }}
      verify-command: python3 scripts/check_live.py
    secrets:
      STATIC_DEPLOY_KEY: ${{ secrets.STATIC_DEPLOY_KEY }}
      STATIC_DEPLOY_KNOWN_HOSTS: ${{ secrets.STATIC_DEPLOY_KNOWN_HOSTS }}
