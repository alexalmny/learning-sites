# Render with envsubst '${LEARNING_HOST}' before installation.
server {
    listen 80;
    listen [::]:80;
    server_name ${LEARNING_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${LEARNING_HOST};

    ssl_certificate /etc/letsencrypt/live/${LEARNING_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LEARNING_HOST}/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    root /var/www/learning-sites/current;
    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
